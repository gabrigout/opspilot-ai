name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Dashboard, Orders, Couriers, Restaurants, Incidents, AI Copilot / tools, Reports, Simulator, Security, Infra / CI, Docs]
