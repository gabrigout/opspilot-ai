name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what did you get?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options: [Docker Compose, Without Docker (SQLite), GitHub Codespaces, Other]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Please remove any secrets before pasting.
