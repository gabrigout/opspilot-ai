# Render blueprint (backend + managed PostgreSQL). The frontend is deployed separately on Vercel.
# See docs/DEPLOYMENT.md. Secrets marked `sync: false` are entered in the Render dashboard.
databases:
  - name: opspilot-db
    plan: free
    databaseName: opspilot
    user: opspilot

services:
  - type: web
    name: opspilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: opspilot-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false          # e.g. https://your-frontend.vercel.app
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: AI_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
